name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Assets
        run: |
          cd client
          npm run build

      - name: Sync Capacitor iOS
        run: |
          cd client
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd client/ios/App
          pod install

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd client/ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          ARCHIVE_PATH="${{ github.workspace }}/client/ios/App/build/App.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/App.app"
          
          echo "Looking for App.app at: $APP_PATH"
          if [ -d "$APP_PATH" ]; then
            echo "Found App.app! Packaging to IPA..."
            mkdir -p ${{ github.workspace }}/Payload
            cp -r "$APP_PATH" ${{ github.workspace }}/Payload/
            cd ${{ github.workspace }}
            zip -r App.ipa Payload
            echo "=== IPA Created Successfully ==="
            ls -lh App.ipa
          else
            echo "App.app not found directly. Searching inside archive:"
            find "$ARCHIVE_PATH" -name "*.app"
            APP_FOUND=$(find "$ARCHIVE_PATH" -name "*.app" | head -n 1)
            if [ -n "$APP_FOUND" ]; then
              echo "Using found app: $APP_FOUND"
              mkdir -p ${{ github.workspace }}/Payload
              cp -r "$APP_FOUND" ${{ github.workspace }}/Payload/
              cd ${{ github.workspace }}
              zip -r App.ipa Payload
              ls -lh App.ipa
            else
              echo "Fatal: No .app found in archive"
              exit 1
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-game-ios-ipa
          path: ${{ github.workspace }}/App.ipa
          if-no-files-found: error
          retention-days: 14